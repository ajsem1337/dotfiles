# Wygląd
enable_audio_bell no
cursor_shape beam
cursor_blink_interval -1

background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 14
confirm_os_window_close -1
linux_display_server x11

# Karty
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Normalne kopiowanie i wklejanie
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Programy mogą zapisywać schowek, ale przed odczytem Kitty zapyta
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Tylko używane sterowanie oknami i kartami
map ctrl+n new_window
map ctrl+w close_window_with_confirmation
map ctrl+shift+n new_tab
map ctrl+shift+w close_tab

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Fokus między oknami Kitty
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Rozmiar czcionki
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto

#THEME
include current-theme.conf