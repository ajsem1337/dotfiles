#!/usr/bin/nft -f
# Desktop firewall: shared IPv4/IPv6 policy.
# Replace only this table; preserve rules belonging to VPNs or containers.
destroy table inet filter

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid counter drop
        ct state established,related accept

        # ICMP errors, ping and IPv6 neighbour/router discovery.
        ip protocol icmp icmp type {
            destination-unreachable, time-exceeded, parameter-problem, echo-request
        } accept
        meta l4proto ipv6-icmp accept

        # DHCP replies, including renewal and initial address assignment.
        meta nfproto ipv4 udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 ip6 daddr fe80::/10 udp sport 547 udp dport 546 accept

        # Preserve the multicast discovery exceptions previously supplied by UFW.
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept
        ip daddr 239.255.255.250 udp dport 1900 accept
        ip6 daddr ff02::f udp dport 1900 accept

        limit rate 3/minute burst 10 packets log prefix "[NFT BLOCK] " level warn
        counter
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        limit rate 3/minute burst 10 packets log prefix "[NFT FORWARD BLOCK] " level warn
        counter
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
